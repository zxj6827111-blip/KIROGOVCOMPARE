name: CI

on:
  pull_request:
    branches:
      - main
      - 'feat/**'
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: gov_report_diff
      DB_USER: postgres
      DB_PASSWORD: postgres
      BASE_URL: http://localhost:3000/api
      LLM_PROVIDER: stub
      GEMINI_API_KEY: ""
      PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan for hidden control characters
        run: python3 scripts/check_control_chars.py

      - name: Install backend dependencies
        run: npm ci

      - name: Backend typecheck
        run: npx tsc --noEmit

      - name: Backend tests
        run: npm test -- --runInBand --watchAll=false

      - name: Build backend
        run: npm run build

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: npm audit report (informational)
        run: npm audit --audit-level=low || true

      - name: npm audit gate
        # 门禁只卡 critical。2026-10-14 定这个口径的原因：上游还有三条公告压根没发修复版
        # —— braces 最新就是 3.0.3（区间 <=3.0.3）、sprintf-js 最新就是 1.1.3（区间 <=1.1.3）、
        # extract-zip 最新就是 2.0.1（区间 <=2.0.1），所以 moderate/high 门禁今天不可能通过。
        # 能甩掉这些链的只有 jest 30 / puppeteer 25 / pdfjs-dist 6 / csv-parse 7 的 major 迁移，
        # 而那次迁移会换掉测试运行时（puppeteer 25 是 ESM-only），属于独立工程单独做。
        # 完整报告仍在上一步打印，债不会被忘记。
        run: npm audit --audit-level=critical

      - name: Whitespace check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check "HEAD^..HEAD"
          else
            git diff --check HEAD
          fi
