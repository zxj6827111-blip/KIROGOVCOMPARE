name: CI

on:
  pull_request:
    branches:
      - main
      - 'feat/**'
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: gov_report_diff
      DB_USER: postgres
      DB_PASSWORD: postgres
      BASE_URL: http://localhost:3000/api
      LLM_PROVIDER: stub
      GEMINI_API_KEY: ""
      PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan for hidden control characters
        run: python3 scripts/check_control_chars.py

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand

